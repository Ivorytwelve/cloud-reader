<!DOCTYPE html>
<html class="writing-horizontal-tb h-full w-full" lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1"
      name="viewport"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%sveltekit.assets%/apple-touch-icon.png?v=3"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="152x152"
      href="%sveltekit.assets%/favicon.png?v=3"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%sveltekit.assets%/icons/regular-icon@32x32.png?v=3"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%sveltekit.assets%/icons/regular-icon@16x16.png?v=3"
    />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest?v=3" />
    <meta name="theme-color" content="#90CAF9" />
    <link rel="mask-icon" href="%sveltekit.assets%/safari-pinned-tab.svg?v=3" color="#90CAF9" />
    %sveltekit.head%
  </head>
  <body class="h-full w-full break-words font-sans">
    <div class="h-full w-full">%sveltekit.body%</div>
  </body>
</html>
